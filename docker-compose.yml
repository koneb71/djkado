# DJKado — docker compose (also usable as a Dokploy "Compose" service).
# The app is fully static + a tiny API; no database. Everything user-side lives in the browser (IndexedDB).
services:
  djkado:
    build:
      context: .
      args:
        # optional: real Spotify (PKCE) — must match the URI registered in the Spotify dashboard
        VITE_SPOTIFY_CLIENT_ID: ${VITE_SPOTIFY_CLIENT_ID:-}
        VITE_SPOTIFY_REDIRECT_URI: ${VITE_SPOTIFY_REDIRECT_URI:-}
    image: djkado:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      # optional: real Apple Music (developer token minted server-side)
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      # either mount the .p8 and set the path, or paste the PEM into APPLE_PRIVATE_KEY (\n-escaped is fine)
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
